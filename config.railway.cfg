# -*- coding: utf-8 -*-
# Railway / hosted configuration: every secret and id comes from environment
# variables. The start command copies this file to config.cfg before boot
# (config.cfg is gitignored and used directly for local development).
import os


def _int_list(value):
	return [int(i) for i in value.split(',') if i.strip()] if value else []


# Discord credentials
DC_BOT_TOKEN = os.environ['DC_BOT_TOKEN']
DC_CLIENT_ID = int(os.environ.get('DC_CLIENT_ID', '1514259653293248612'))
DC_CLIENT_SECRET = os.environ.get('DC_CLIENT_SECRET', '')
DC_INVITE_LINK = os.environ.get('DC_INVITE_LINK', '')
DC_OWNER_ID = int(os.environ['DC_OWNER_ID'])
DC_SLASH_SERVERS = _int_list(os.environ.get('DC_SLASH_SERVERS', ''))  # comma-separated guild ids

DB_URI = os.environ['DB_URI']  # mysql://user:password@hostname:port/database
LOG_LEVEL = os.environ.get('LOG_LEVEL', 'INFO')
COMMANDS_URL = "https://github.com/soradozere/jk2-matchmaker/blob/main/COMMANDS.md"
HELP = """JK2 Matchmaker is a discord bot for JK2 CTF pickup games, powered by Soracle."""
STATUS = os.environ.get('STATUS', 'jk2ctf pickups')

# Soracle API (player data and team balancing)
SORACLE_API_URL = os.environ.get('SORACLE_API_URL', 'https://soracle.vercel.app')
SORACLE_API_SECRET = os.environ['SORACLE_API_SECRET']

# Channels whose .csv scoreboard attachments are uploaded to Soracle's approval
# queue (comma-separated channel ids). For a dedicated screenshots channel.
SCOREBOARD_CHANNELS = _int_list(os.environ.get('SCOREBOARD_CHANNELS', ''))

# Web server (unused on Railway)
WS_ENABLE = False
